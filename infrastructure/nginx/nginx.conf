# Proxy cache path (stored in Nginx memory & disk)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=API_CACHE:20m max_size=1g inactive=60m use_temp_path=off;

upstream api_gateway_upstream {
    # Load balancing algorithm (least connections)
    least_conn;

    # Upstream instances (Docker service or multiple backend instances)
    server api-gateway:4000 max_fails=3 fail_timeout=30s;
    # server api-gateway-2:4000 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Client body size limit
    client_max_body_size 10M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Bypass cache for non-GET methods or when Authorization header is present
    set $no_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) {
        set $no_cache 1;
    }
    if ($http_authorization != "") {
        set $no_cache 1;
    }

    # Static assets caching (CDN & browser cache)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|svg|ttf)$ {
        proxy_pass http://api_gateway_upstream;
        proxy_cache API_CACHE;
        proxy_cache_valid 200 304 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # CDN & browser cache headers (1 day browser, 7 days CDN)
        add_header Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Forward all traffic to the API Gateway load balancer
    location / {
        proxy_pass http://api_gateway_upstream;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy cache configuration for public API responses
        proxy_cache API_CACHE;
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Expose cache status header (HIT, MISS, BYPASS, EXPIRED) for debugging/CDN
        add_header X-Cache-Status $upstream_cache_status;

        # Retry next upstream server on failures
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}


